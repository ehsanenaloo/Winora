# SPDX-License-Identifier: GPL-3.0-only
# Placed by the export at .github/workflows/release.yml of the public repository. A pushed tag v<version> builds the packages from that
# tag and publishes them as a GitHub release with the matching CHANGELOG section as its notes.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ehsanenaloo/Winora'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Winora.slnx --locked-mode

      - name: Package
        shell: pwsh
        run: ./tools/publish.ps1 -SkipTests -Machine

      - name: Check the packages
        shell: pwsh
        run: ./tools/verify_dist.ps1

      # The tag must match the version of the build, so a release never carries files of another version.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The release carries the all-users MSI only: it installs into Program Files, the folder the administrator features require.
          $msi = "dist/Winora-$($tag.TrimStart('v'))-win-x64-machine.msi"
          if (-not (Test-Path $msi)) { throw "Tag $tag does not match the built version (no $msi)." }
          # SHA256SUMS and the notes list only the files attached to the release.
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $names = @((Split-Path $msi -Leaf), 'sbom.cdx.json')
          Get-Content dist/SHA256SUMS | Where-Object { $names -contains ($_ -replace '^\S+ \*', '') } | Set-Content -Encoding utf8NoBOM dist/release/SHA256SUMS
          Get-Content dist/RELEASE-NOTES.md | Where-Object { $_ -notmatch '^Files: ' } | Set-Content -Encoding utf8NoBOM dist/release/RELEASE-NOTES.md
          $files = @($msi, 'dist/release/SHA256SUMS', 'dist/sbom.cdx.json')
          gh release create $tag @files --title "Winora $($tag.TrimStart('v'))" --notes-file dist/release/RELEASE-NOTES.md --verify-tag
