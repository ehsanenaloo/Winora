# SPDX-License-Identifier: GPL-3.0-only
# Placed by the export at .github/workflows/release.yml of the public repository. A pushed tag v<version> builds the packages from that
# tag and publishes them as a GitHub release with the matching CHANGELOG section as its notes.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ehsanenaloo/Winora'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Winora.slnx --locked-mode

      - name: Package
        shell: pwsh
        run: ./tools/publish.ps1 -SkipTests

      - name: Check the packages
        shell: pwsh
        run: ./tools/verify_dist.ps1

      # The tag must match the version of the build, so a release never carries files of another version.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem dist -Filter 'Winora-*-portable.zip' | Select-Object -First 1
          if (-not $zip -or $zip.Name -ne "Winora-$($tag.TrimStart('v'))-win-x64-portable.zip") { throw "Tag $tag does not match the built version ($($zip.Name))." }
          $files = @($zip.FullName) + @(Get-ChildItem dist -Filter 'Winora-*.msi' | ForEach-Object FullName) + @('dist/SHA256SUMS', 'dist/sbom.cdx.json')
          gh release create $tag @files --title "Winora $($tag.TrimStart('v'))" --notes-file dist/RELEASE-NOTES.md --verify-tag
