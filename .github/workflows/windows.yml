# SPDX-License-Identifier: GPL-3.0-only
name: Windows build and package
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. No secrets are used anywhere in this file.
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    if: github.repository == 'ehsanenaloo/Winora'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to exact release tags. Before a public release, replace each tag with the full commit SHA of that
      # release (cannot be looked up from the offline development machine) so a moved tag cannot change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Winora.slnx --locked-mode

      - name: Build
        run: dotnet build Winora.slnx -c Release --no-restore

      # publish.ps1 builds the portable zip, the per-user MSI, the package list and SHA256SUMS, then builds again from a copy of the tree at
      # another path (-ReproCheck) and compares the hashes. Nothing is installed.
      - name: Package
        shell: pwsh
        run: ./tools/publish.ps1 -SkipTests -ReproCheck

      - name: Check the packages
        shell: pwsh
        run: ./tools/verify_dist.ps1

      - name: Upload the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winora-dist
          path: |
            dist/Winora-*-portable.zip
            dist/Winora-*.msi
            dist/SHA256SUMS
            dist/sbom.cdx.json
            dist/RELEASE-NOTES.md
          if-no-files-found: error
