name: Question
description: Ask how to use Winora.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the release limits first: technical-docs/release-limits.md in this repository.
        This is a volunteer project, so replies are best effort. Do not paste personal data.
  - type: textarea
    id: question
    attributes:
      label: What do you want to do?
      description: Say what you are trying to do and what you tried so far.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Winora version
      description: Shown in About Winora.
  - type: input
    id: windows
    attributes:
      label: Windows build
      placeholder: "26100"
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the release limits and searched existing issues.
          required: true
        - label: I did not include personal data.
          required: true
