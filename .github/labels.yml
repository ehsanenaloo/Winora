# Labels used by this project.
# Create or update them by hand in the repository's Labels page, or with any label sync tool that reads this file.
# Colors are hex values without the leading #.

- name: bug
  color: d73a4a
  description: Something does not work as expected
- name: setting-request
  color: f9a03f
  description: Request for a new Windows setting, with an official source
- name: enhancement
  color: a2eeef
  description: New feature or improvement
- name: documentation
  color: 0075ca
  description: Improvements to docs or screenshots
- name: translation
  color: 0e8a16
  description: Translation fix
- name: persian
  color: 006b75
  description: Persian text, right-to-left layout or native review
- name: good first issue
  color: 7057ff
  description: Small and well described, good for a first contribution
- name: help wanted
  color: 008672
  description: The maintainer would welcome help with this
- name: question
  color: d876e3
  description: A usage question, not a bug
- name: duplicate
  color: cfd3d7
  description: This already exists in another issue or pull request
- name: invalid
  color: e4e669
  description: This is not a valid report or does not apply
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: security
  color: b60205
  description: Security related. Use private reporting for vulnerabilities
- name: accessibility
  color: 1d76db
  description: Keyboard, screen reader, contrast or scaling issues
- name: performance
  color: fbca04
  description: Speed or memory use
- name: needs triage
  color: ededed
  description: Not reviewed by the maintainer yet
- name: blocked
  color: 5319e7
  description: Waiting on something else before work can continue
# Used by Dependabot (see dependabot.yml).
- name: dependencies
  color: 0366d6
  description: Updates to NuGet packages and GitHub Actions versions
